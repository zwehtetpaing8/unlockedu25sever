  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0f0f;
      color: #ffffff;
      font-family: sans-serif;
      padding: 20px;
    }
    h1 {
      text-align: center;
      font-size: 2em;
      margin: 20px 0 5px;
      background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }
    h2 {
      color: #ffd93d;
      margin: 20px 0 10px;
      border-left: 4px solid #ffd93d;
      padding-left: 10px;
    }
    ul { list-style: none; }
    ul li { margin: 10px 0; }
    ul li a {
      display: block;
      background: #1e1e1e;
      color: #ffffff;
      padding: 12px 16px;
      border-radius: 10px;
      text-decoration: none;
      border-left: 4px solid #ff6b6b;
      transition: 0.3s;
    }
    ul li:nth-child(2) a { border-color: #ffd93d; }
    ul li:nth-child(3) a { border-color: #6bcb77; }
    ul li:nth-child(4) a { border-color: #4d96ff; }
    ul li:nth-child(5) a { border-color: #ff6b6b; }
    ul li:nth-child(6) a { border-color: #ffd93d; }
    ul li:nth-child(7) a { border-color: #6bcb77; }
    ul li:nth-child(8) a { border-color: #4d96ff; }
    ul li:nth-child(9) a { border-color: #ff6b6b; }
    ul li:nth-child(10) a { border-color: #ffd93d; }
    ul li:nth-child(11) a { border-color: #6bcb77; }
    ul li a:hover {
      background: #2a2a2a;
      transform: translateX(5px);
    }
  </style>
</head>
